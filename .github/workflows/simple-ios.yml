name: Simple iOS Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Create the missing intl file
        run: |
          mkdir -p lib/generated/intl
          cat > lib/generated/intl/messages_all.dart << 'EOF'
          library messages_all;
          import 'dart:async';
          Future<Null> initializeMessages(String locale) async {
            return Future.value();
          }
          EOF
          cat > lib/generated/intl/messages_en.dart << 'EOF'
          library messages_en;
          import 'package:intl/intl.dart';
          final messages = {};
          EOF

      - name: Build iOS for simulator
        run: |
          flutter pub get
          flutter build ios --simulator --debug
          echo "Build completed, checking output..."
          ls -la build/ios/iphonesimulator/
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app
          mv Runner.zip ../../
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: Runner.zip
        if: always()
