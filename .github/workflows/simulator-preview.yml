name: iOS Simulator Preview

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
      
      - name: Build for simulator
        run: |
          flutter pub get
          flutter build ios --simulator --release
          cd build/ios/iphonesimulator
          zip -r Runner.zip Runner.app
      
      - name: Upload to Appetize
        run: |
          # This requires an API key from Appetize.io
          curl -F "file=@build/ios/iphonesimulator/Runner.zip" \
            "https://api.appetize.io/v1/apps?platform=ios&token=${{ secrets.APPETIZE_TOKEN }}"
      
      - uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: build/ios/iphonesimulator/Runner.zip
